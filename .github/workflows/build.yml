name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check tag matches plugin version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          csproj_version="$(sed -n 's:.*<AssemblyVersion>\([0-9]*\.[0-9]*\.[0-9]*\)\.[0-9]*</AssemblyVersion>.*:\1:p' TrailerEditor/TrailerEditor.csproj | head -n1)"
          if [ -z "$csproj_version" ]; then
            echo "::error::Could not read AssemblyVersion from TrailerEditor/TrailerEditor.csproj"
            exit 1
          fi
          if [ "$tag_version" != "$csproj_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the plugin version $csproj_version.0 in TrailerEditor.csproj. Update the version or tag v$csproj_version."
            exit 1
          fi

      - name: Test
        run: dotnet test TrailerEditor.sln -c Release

      - name: Build plugin
        run: dotnet build TrailerEditor/TrailerEditor.csproj -c Release

      - name: Create TrailerEditor.zip
        run: |
          mkdir -p dist
          cp TrailerEditor/bin/Release/netstandard2.0/TrailerEditor.dll dist/
          cat > dist/INSTALL.txt <<'INSTALL'
          Trailer Editor for Emby - install
          1. Copy TrailerEditor.dll into Emby's plugins folder:
             Docker: /config/plugins   Linux: /var/lib/emby/plugins
             Windows: %AppData%\Emby-Server\programdata\plugins
          2. Linux/Docker: give the file the same owner as the other plugins in that folder
             (for example: chown --reference=<another plugin>.dll TrailerEditor.dll).
          3. Restart Emby Server.
          4. Open Plugins in the Emby dashboard and check that Trailer Editor is listed.
          More: https://github.com/PeterDBNL/emby-trailer-editor
          INSTALL
          sed -i 's/^          //' dist/INSTALL.txt
          (cd dist && zip -9 ../TrailerEditor.zip TrailerEditor.dll INSTALL.txt)
          unzip -l TrailerEditor.zip

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: TrailerEditor
          path: TrailerEditor.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TrailerEditor.zip
          generate_release_notes: true

      # Pushing a new plugin version to the default branch publishes it as a release
      # automatically (tag vX.Y.Z is created by the release step), unless that release exists.
      - name: Check for a new version (default branch only)
        id: newversion
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          version="$(sed -n 's:.*<AssemblyVersion>\([0-9]*\.[0-9]*\.[0-9]*\)\.[0-9]*</AssemblyVersion>.*:\1:p' TrailerEditor/TrailerEditor.csproj | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Release v$version already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $version: publishing release v$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release (new version on default branch)
        if: steps.newversion.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.newversion.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Trailer Editor ${{ steps.newversion.outputs.version }}
          files: TrailerEditor.zip
          generate_release_notes: true
