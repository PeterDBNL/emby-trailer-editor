name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test TrailerEditor.sln -c Release

      - name: Build plugin
        run: dotnet build TrailerEditor/TrailerEditor.csproj -c Release

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: TrailerEditor
          path: TrailerEditor/bin/Release/netstandard2.0/TrailerEditor.dll

      - name: Attach DLL to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TrailerEditor/bin/Release/netstandard2.0/TrailerEditor.dll
